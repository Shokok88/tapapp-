<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Macro VPN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{--bg:#080b18;--sf:rgba(150,180,255,.06);--ln:rgba(170,200,255,.14);--tx:#eef2ff;--mu:#8e9ac0;--ice:#7fe3ff;--blue:#5b7cff;--amb:#ffb454;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.5,.64,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:ui-rounded,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(70% 40% at 50% -5%,rgba(91,124,255,.35),transparent),linear-gradient(rgba(170,200,255,.05) 1px,transparent 1px) 0 0/34px 34px,linear-gradient(90deg,rgba(170,200,255,.05) 1px,transparent 1px) 0 0/34px 34px;-webkit-mask:linear-gradient(#000 30%,transparent 90%);mask:linear-gradient(#000 30%,transparent 90%)}
main{padding:calc(env(safe-area-inset-top) + 16px) 16px calc(112px + env(safe-area-inset-bottom));overflow-x:hidden}
.page{animation:fin .5s var(--ease) both}.page.out{animation:fout .2s ease-in both}
.page>*{animation:fin .6s var(--ease) both;animation-delay:calc(var(--i,0)*50ms)}
.page.q,.page.q>*{animation:none}
@keyframes fin{from{opacity:0;transform:translate(var(--dx,0),16px) scale(.98);filter:blur(8px)}}
@keyframes fout{to{opacity:0;transform:translateX(calc(var(--dx,0)*-1)) scale(.98);filter:blur(6px)}}
@keyframes blink{50%{opacity:.3}}
.glass{background:var(--sf);border:1px solid var(--ln);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%)}
.glow{position:relative}
.glow::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;background:conic-gradient(from var(--a),var(--ice),var(--blue),var(--amb),var(--ice));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:spin 7s linear infinite}
@keyframes spin{to{--a:360deg}}
h2{font-size:24px;margin:0 0 4px}h3{font-size:18px;margin:22px 0 12px}
.sub{color:var(--mu);font-size:15px;margin-bottom:16px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:19px;color:#06101f;background:linear-gradient(135deg,var(--ice),var(--blue))}
.top small{color:var(--mu);display:block;font-size:13px}
.chip{margin-left:auto;padding:7px 12px;border-radius:99px;font-size:13px;font-weight:600;color:var(--ice);display:flex;align-items:center;gap:7px}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ice);animation:blink 2s ease-in-out infinite}
.hero{border-radius:28px;padding:20px;display:flex;align-items:center;gap:20px;margin-bottom:14px}
.rw{position:relative;width:112px;height:112px;flex:none}.rw div{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:24px;font-weight:700}.rw small{font-size:11px;color:var(--mu);font-weight:500}
.ring{width:112px;height:112px;transform:rotate(-90deg)}.trk{fill:none;stroke:rgba(255,255,255,.08);stroke-width:8}
.arc{fill:none;stroke:url(#g);stroke-width:8;stroke-linecap:round;stroke-dasharray:276.5;stroke-dashoffset:276.5;transition:stroke-dashoffset 1.5s var(--ease) .3s}
.big{font-size:46px;font-weight:800;letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums}.hero p{margin:4px 0 0;color:var(--mu);font-size:14px}
.sc{border-radius:28px;padding:20px;margin-bottom:14px}
.kh{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;margin-bottom:12px}
.url{font:13px ui-monospace,Menlo,monospace;color:var(--ice);padding:13px 14px;border-radius:14px;background:rgba(127,227,255,.07);border:1px dashed rgba(127,227,255,.35);margin-bottom:12px;word-break:break-all}
.btn{position:relative;overflow:hidden;width:100%;padding:16px;border:0;border-radius:18px;font:700 17px ui-rounded,-apple-system,sans-serif;color:#06101f;background:linear-gradient(135deg,var(--ice),var(--blue));box-shadow:0 12px 32px -12px rgba(91,124,255,.9);transition:transform .35s var(--spring),background .4s}
.btn:active{transform:scale(.95)}.btn.ghost{background:var(--sf);color:var(--tx);border:1px solid var(--ln);box-shadow:none}.btn+.btn{margin-top:10px}
.rip{position:relative;overflow:hidden}.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.3);transform:scale(0);animation:rp .65s ease-out;pointer-events:none}@keyframes rp{to{transform:scale(1);opacity:0}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two>div{border-radius:20px;padding:16px;font-size:26px;transition:transform .4s var(--spring)}.two>div:active{transform:scale(.94)}.two b{display:block;font-size:15px;margin-top:6px}
.bal{display:grid;grid-template-columns:1fr 1fr;border-radius:22px;padding:16px;margin-bottom:14px;text-align:center}.bal b{font-size:30px;display:block;font-variant-numeric:tabular-nums}.bal small{color:var(--mu);font-size:13px}
.ww{position:relative;width:min(76vw,290px);aspect-ratio:1;margin:12px auto 20px}
.wh{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(127,227,255,.55);box-shadow:0 0 50px -8px rgba(127,227,255,.5);transition:transform 5.2s cubic-bezier(.12,.72,.08,1)}
.wh i{position:absolute;inset:0;display:flex;justify-content:center;padding-top:15px;font-style:normal;font-size:12px;font-weight:700;color:#fff}
.ww::after{content:"";position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:var(--bg);border:3px solid var(--ice);z-index:1}
.ptr{position:absolute;top:-10px;left:50%;margin-left:-13px;border:13px solid transparent;border-top:22px solid var(--amb);z-index:2;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.dy{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.dy span{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:700;border:1px solid var(--ln);color:var(--mu);transition:all .4s var(--spring)}
.dy .done{background:var(--ice);color:#06101f;border-color:var(--ice);transform:scale(1.06)}.dy .now{border-color:var(--amb);color:var(--amb);animation:blink 1.6s infinite}
.gv{border-radius:22px;padding:16px;margin-bottom:10px}.gv .r{display:flex;justify-content:space-between;align-items:center;gap:12px}.gv b{font-size:17px}.gv small{color:var(--mu);font-size:13px;display:block;margin-top:3px}
.gv .t{font:600 14px ui-monospace,Menlo,monospace;color:var(--amb);margin:10px 0 12px}.gv .btn{padding:12px;font-size:15px;border-radius:14px}
.inp{display:flex;gap:10px}.inp input{flex:1;min-width:0;padding:14px 16px;border-radius:16px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:600 16px ui-rounded,sans-serif;outline:0;-webkit-user-select:text;user-select:text;transition:border-color .3s}
.inp input:focus{border-color:var(--ice)}.inp .btn{width:auto;padding:0 22px;margin:0}
.kr{display:flex;align-items:center;gap:14px;border-radius:20px;padding:14px 16px;margin-bottom:10px;transition:transform .4s var(--spring),border-color .3s}.kr:active{transform:scale(.96);border-color:var(--ice)}
.kr .fl{font-size:30px}.kr b{font-size:17px}.kr small{display:block;color:var(--mu);font-size:13px;margin-top:2px}
.cp{margin-left:auto;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;border:1px solid var(--ln);flex:none}.cp svg{width:20px;height:20px;stroke:var(--ice);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.app{border-radius:22px;padding:16px;transition:transform .4s var(--spring),border-color .3s}.app:active{transform:scale(.93);border-color:var(--ice)}
.app i{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:21px;color:#06101f;margin-bottom:12px}.app b{display:block;font-size:17px}.app small{color:var(--mu);font-size:12px}
.plan{position:relative;display:flex;align-items:center;gap:12px;border-radius:22px;padding:18px;margin-bottom:12px;transition:transform .45s var(--spring),border-color .3s,box-shadow .4s}
.plan b{font-size:18px}.plan small{display:block;color:var(--mu);font-size:13px;margin-top:2px}.pr{margin-left:auto;text-align:right}.pr b{font-size:22px}
.plan.sel{transform:scale(1.02);border-color:var(--ice);box-shadow:0 0 0 1px var(--ice),0 14px 44px -14px rgba(127,227,255,.55)}
.chk{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ln);flex:none;display:grid;place-items:center;transition:all .35s var(--spring)}
.plan.sel .chk{background:var(--ice);border-color:var(--ice);transform:scale(1.12)}.plan.sel .chk::after{content:"";width:6px;height:11px;border:solid #06101f;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.badge{position:absolute;top:-10px;right:18px;padding:4px 11px;border-radius:99px;background:var(--amb);color:#2a1800;font-size:12px;font-weight:700;font-style:normal}
.faq{border-radius:18px;margin-bottom:10px;padding:16px;transition:border-color .3s}.faq.open{border-color:var(--ice)}
.faq .q{display:flex;justify-content:space-between;gap:12px;font-weight:600;font-size:16px}.faq .q::after{content:"+";font-size:22px;line-height:1;color:var(--ice);transition:transform .45s var(--spring)}.faq.open .q::after{transform:rotate(135deg)}
.faq .b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}.faq.open .b{grid-template-rows:1fr}.faq .b div{overflow:hidden;color:var(--mu);font-size:15px;line-height:1.45}.faq.open .b div{padding-top:10px}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;padding:6px;border-radius:30px;z-index:5;box-shadow:0 20px 50px -10px rgba(0,0,0,.7);background:rgba(14,19,40,.72)}
.ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:24px;background:rgba(127,227,255,.13);border:1px solid rgba(127,227,255,.4);transition:transform .6s var(--spring)}
.tab{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;font-size:10.5px;font-weight:600;color:var(--mu);transition:color .3s}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s var(--spring)}
.tab.on{color:var(--ice)}.tab.on svg{transform:translateY(-2px) scale(1.15)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));z-index:30;transform:translate(-50%,30px) scale(.9);opacity:0;padding:12px 20px;border-radius:99px;font-weight:600;font-size:15px;background:rgba(14,19,40,.95);border:1px solid var(--ice);transition:all .5s var(--spring);pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.ov{position:fixed;inset:0;z-index:25;display:grid;place-items:center;background:rgba(4,6,14,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .3s}.ov.in{opacity:1}
.md{width:min(86vw,340px);border-radius:28px;padding:28px 22px 22px;text-align:center;background:rgba(14,19,40,.96);transform:scale(.8);transition:transform .5s var(--spring)}.ov.in .md{transform:scale(1)}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs glass" id="tabs"><div class="ind" id="ind"></div></nav>
<div class="toast" id="toast"></div>
<canvas id="cf" style="position:fixed;inset:0;pointer-events:none;z-index:40"></canvas>
<script>
const tg=window.Telegram.WebApp,$=s=>document.querySelector(s);
const G=new URLSearchParams(location.search).get('go');
const hp=(t='light')=>{try{tg.HapticFeedback.impactOccurred(t)}catch(e){}};
const SUB='https://sub.macro.example/s/9fK2xQ7aLm';
const BOT='MacroVPNbot';
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',gift:'<rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 13h18M12 8C10 3 6 4 7 7c.6 1.6 3.4 1.2 5 1zM12 8c2-5 6-4 5-1-.6 1.6-3.4 1.2-5 1z"/>',keys:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/>',apps:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',plans:'<path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20"/>',copy:'<rect x="9" y="9" width="12" height="12" rx="3"/><path d="M5 15V6a3 3 0 0 1 3-3h9"/>'};
const svg=k=>`<svg viewBox="0 0 24 24">${IC[k]}</svg>`;
const TABS=[['home','Главная','home'],['bonus','Бонусы','gift'],['keys','Ключи','keys'],['apps','Установка','apps'],['plans','Тарифы','plans']];
const PL=[{n:'1 месяц',s:'Для знакомства',p:199,m:199},{n:'3 месяца',s:'Самый популярный',p:499,m:166,hot:1},{n:'12 месяцев',s:'Год без забот',p:1490,m:124}];
const KEYS=[['🇳🇱','Нидерланды','VLESS · Reality','vless://test-nl@nl.macro.example:443?security=reality#Macro-NL'],['🇩🇪','Германия','VLESS · Reality','vless://test-de@de.macro.example:443?security=reality#Macro-DE'],['🇫🇮','Финляндия','Hysteria2','hysteria2://test-fi@fi.macro.example:443#Macro-FI']];
const APPS=[['Happ','H','iOS · Android · PC','happ://add/'+SUB,'#7fe3ff,#5b7cff'],['INCY','I','iOS · Android · PC','incy://import/'+SUB,'#ffb454,#ff7a59'],['v2RayTun','V','iOS · Android','v2raytun://import/'+SUB,'#9be58a,#35c2a0'],['Streisand','S','iOS · macOS','streisand://import/'+SUB,'#c9a7ff,#7a8cff'],['Hiddify','Hi','Все платформы','hiddify://import/'+SUB+'#Macro%20VPN','#ff9ec4,#ff6b9a']];
const FAQ=[['Как добавить ключ в Happ','Откройте вкладку «Установка», нажмите Happ и подтвердите импорт. Либо скопируйте ссылку подписки и вставьте её в приложении.'],['Приложение не открывается','Сначала установите нужный клиент из App Store или Google Play, затем нажмите на него ещё раз.']];
const PZ=[['+1 день',1,0],['+3 дня',3,0],['+500 МБ',0,.5],['+7 дней',7,0],['+1 день',1,0],['+2 ГБ',0,2],['+30 дней',30,0],['+3 дня',3,0]];
const GV=[['iPhone 17 Pro','Главный приз · 1 победитель',3.2*864e5,1284],['1 год Macro VPN','10 победителей',1.1*864e5,842],['30 дней в подарок','50 победителей',9*36e5,2310]];
const S=(k,v)=>{try{return v===undefined?JSON.parse(localStorage.getItem('m_'+k)):localStorage.setItem('m_'+k,JSON.stringify(v))}catch(e){return null}};
const mk=()=>({days:0,gb:0,last:'',streak:0,spin:0,join:[],trial:null,promo:0,t0:Date.now()});
let st=Object.assign(mk(),S('st')||{}),sel=1,cur=-1,busy=false,rot=0,spinning=false;
const save=()=>S('st',st);save();
const user=(tg.initDataUnsafe||{}).user,name=(user&&user.first_name)||'гость';
const p2=n=>String(n).padStart(2,'0');
const fm=ms=>{const s=Math.max(0,Math.floor(ms/1000)),d=Math.floor(s/86400);return(d?d+'д ':'')+p2(Math.floor(s%86400/3600))+':'+p2(Math.floor(s%3600/60))+':'+p2(s%60)};
const cd=(ts,done)=>`<span data-cd="${ts}" data-done="${done}"></span>`;
const P={
home:()=>`<div class="page"><div class="top"><div class="av">${name[0].toUpperCase()}</div><div><small>Добро пожаловать</small><b style="font-size:19px">${name}</b></div><div class="chip glass">Активна</div></div>
<div class="hero glass"><div class="rw"><svg class="ring" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fe3ff"/><stop offset="1" stop-color="#5b7cff"/></linearGradient></defs><circle class="trk" cx="50" cy="50" r="44"/><circle class="arc" id="arc" cx="50" cy="50" r="44"/></svg><div>${(96.8+st.gb).toFixed(1)}<small>ГБ осталось</small></div></div><div><div class="big" data-n="${12+st.days}">0</div><p>дней до продления</p></div></div>
<div class="sc glass glow"><div class="kh">Ссылка подписки</div><div class="url">https://sub.macro.example/s/9fK2••••••</div><button class="btn rip" onclick="copy(SUB,'Ссылка скопирована ✓')">Скопировать ссылку</button><button class="btn ghost rip" onclick="go('apps')">Добавить в приложение</button></div>
<div class="two"><div class="glass rip" onclick="go('bonus')">🎡<b>Колесо удачи</b></div><div class="glass rip" onclick="go('bonus')">🎁<b>Подарок дня</b></div></div></div>`,
bonus:()=>{const t=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString(),ok=st.last==t,sk=(ok||st.last==y)?st.streak:0,sh=ok?sk:sk%7;
return`<div class="page"><div><h2>Бонусы</h2><div class="sub">Крутите, получайте, участвуйте</div></div>
<div class="bal glass"><div><b id="bd">${st.days}</b><small>бонусных дней</small></div><div><b id="bg">${st.gb}</b><small>ГБ в подарок</small></div></div>
<div class="sc glass glow"><div class="kh">🎡 Колесо удачи</div><div class="ww"><div class="ptr"></div><div class="wh" id="wh" style="transform:rotate(${rot}deg);background:conic-gradient(from -22.5deg,${PZ.map((p,i)=>`${i==6?'#6b4a12':i%2?'#1c2d66':'#14204a'} ${i*45}deg ${i*45+45}deg`).join()})">${PZ.map((p,i)=>`<i style="transform:rotate(${i*45}deg)">${p[0]}</i>`).join('')}</div></div><button class="btn rip" onclick="spin()">${cd(st.spin+864e5,'Крутить колесо')}</button></div>
<div class="sc glass"><div class="kh">🎁 Подарок дня</div><div class="dy">${[0,1,2,3,4,5,6].map(i=>`<span class="${i<sh?'done':i==sh&&!ok?'now':''}">${i<sh?'✓':i==6?'+3':'+1'}</span>`).join('')}</div><button class="btn rip ${ok?'ghost':''}" onclick="claim()">${ok?'Завтра будет новый':'Забрать подарок'}</button></div>
<h3>Раздачи</h3>${GV.map((g,i)=>{const j=st.join.includes(i);return`<div class="gv glass"><div class="r"><div><b>${g[0]}</b><small>${g[1]}</small></div><small>👥 ${g[3]+(j?1:0)}</small></div><div class="t">⏳ ${cd(st.t0+g[2],'Завершено')}</div><button class="btn rip ${j?'ghost':''}" onclick="join(${i})">${j?'Вы участвуете ✓':'Участвовать'}</button></div>`}).join('')}
<h3>Пригласи друзей</h3><div class="sc glass"><div class="url">https://t.me/${BOT}?start=ref_${user?user.id:0}</div><div class="sub" style="margin:0 0 12px">За каждого друга +3 дня вам и ему</div><button class="btn rip" onclick="copy('https://t.me/${BOT}?start=ref_${user?user.id:0}','Реф. ссылка скопирована ✓')">Скопировать ссылку</button></div>
<h3>Промокод</h3><div class="inp"><input id="pc" placeholder="Введите код" autocapitalize="characters"><button class="btn rip" onclick="promo()">ОК</button></div>
<button class="btn ghost rip" style="margin-top:22px" onclick="reset()">Сбросить тест-данные</button></div>`},
keys:()=>{const T=st.trial,live=T&&T.exp>Date.now();return`<div class="page"><div><h2>Мои ключи</h2><div class="sub">Нажмите на ключ, чтобы скопировать</div></div>
<div class="sc glass glow"><div class="kh">🔑 Тестовый ключ</div>${live?`<div class="url">${T.k}</div><div class="sub" style="margin:0 0 12px">Действует ещё ${cd(T.exp,'истёк')}</div><button class="btn rip" onclick="copy(st.trial.k,'Тест-ключ скопирован ✓')">Скопировать</button>`:T?`<div class="sub">Тест закончился. Выберите тариф, чтобы продолжить.</div><button class="btn rip" onclick="go('plans')">Смотреть тарифы</button>`:`<div class="sub">24 часа, 5 ГБ, без оплаты</div><button class="btn rip" onclick="trial()">Получить тест-ключ</button>`}</div>
${KEYS.map((k,i)=>`<div class="kr glass" onclick="copy(KEYS[${i}][3],'Ключ ${k[1]} скопирован ✓')"><div class="fl">${k[0]}</div><div><b>${k[1]}</b><small>${k[2]}</small></div><div class="cp">${svg('copy')}</div></div>`).join('')}
<button class="btn ghost rip" onclick="hp('medium');toast('Тест: новая ссылка выдана')">Выдать новую ссылку</button></div>`},
apps:()=>`<div class="page"><div><h2>Установка</h2><div class="sub">Нажмите на приложение, и ключ добавится сам</div></div><div class="grid">${APPS.map((a,i)=>`<div class="app glass rip" onclick="openApp(${i})"><i style="background:linear-gradient(135deg,${a[4]})">${a[1]}</i><b>${a[0]}</b><small>${a[2]}</small></div>`).join('')}</div><h3>Если не получается</h3>${FAQ.map(f=>`<div class="faq glass" onclick="this.classList.toggle('open');hp('light')"><div class="q">${f[0]}</div><div class="b"><div>${f[1]}</div></div></div>`).join('')}<button class="btn ghost rip" onclick="toast('Тест: чат поддержки')">Написать в поддержку</button></div>`,
plans:()=>`<div class="page"><div><h2>Тарифы</h2><div class="sub">Тестовые цены, оплата не подключена</div></div>${PL.map((p,i)=>`<div class="plan glass rip ${p.hot?'glow':''} ${i==sel?'sel':''}" onclick="pick(${i})"><div><b>${p.n}</b><small>${p.s}</small></div><div class="pr"><b>${p.p} ₽</b><small>${p.m} ₽/мес</small></div><div class="chk"></div>${p.hot?'<em class="badge">Выгодно</em>':''}</div>`).join('')}<button class="btn rip" onclick="hp('medium');toast('Тест: оплата пока не подключена')"><span id="pt">Оплатить ${PL[sel].p} ₽</span></button></div>`};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1900)}
function copy(k,msg){(navigator.clipboard?navigator.clipboard.writeText(k):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=k;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()}).finally(()=>{hp('medium');toast(msg)})}
function openApp(i){hp('medium');const u=location.origin+location.pathname+'?go='+encodeURIComponent(APPS[i][3]);try{tg.openLink(u)}catch(e){location.href=u}}
function pick(i){sel=i;hp('light');document.querySelectorAll('.plan').forEach((e,j)=>e.classList.toggle('sel',j==i));$('#pt').textContent='Оплатить '+PL[i].p+' ₽'}
function boom(){const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const ps=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,r:Math.random()*5+3,c:['#7fe3ff','#5b7cff','#ffb454','#fff'][Math.random()*4|0],a:1}));(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a-=.012;x.globalAlpha=Math.max(p.a,0);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.6)});if(ps[0].a>0)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
function modal(t,s){const m=document.createElement('div');m.className='ov';m.innerHTML=`<div class="md glass"><h2>${t}</h2><div class="sub">${s}</div><button class="btn rip">Отлично</button></div>`;m.querySelector('button').onclick=()=>{m.classList.remove('in');setTimeout(()=>m.remove(),300)};document.body.appendChild(m);requestAnimationFrame(()=>m.classList.add('in'))}
function bal(){$('#bd')&&($('#bd').textContent=st.days);$('#bg')&&($('#bg').textContent=st.gb)}
function spin(){if(spinning)return;if(Date.now()<st.spin+864e5)return toast('Колесо отдыхает ⏳');spinning=true;hp('medium');const pool=[0,0,0,1,1,2,2,2,3,4,4,4,5,6,7,7],i=pool[Math.random()*pool.length|0],base=(360-i*45+(Math.random()*24-12)+720)%360,c=rot%360;rot+=360*6+((base-c+360)%360);$('#wh').style.transform=`rotate(${rot}deg)`;setTimeout(()=>{spinning=false;const z=PZ[i];st.days+=z[1];st.gb+=z[2];st.spin=Date.now();save();bal();boom();hp('heavy');modal('🎉 '+z[0],'Приз уже на вашем балансе (тест)');tick()},5300)}
function claim(){const t=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString();if(st.last==t)return toast('Сегодня подарок уже получен');const sk=st.last==y?st.streak%7:0,n=sk+1;st.streak=n;st.last=t;st.days+=n==7?3:1;save();boom();hp('heavy');toast(n==7?'Серия 7 дней: +3 дня 🔥':'Подарок получен: +1 день');re()}
function join(i){hp('medium');const k=st.join.indexOf(i);k<0?st.join.push(i):st.join.splice(k,1);save();if(k<0)boom();toast(k<0?'Вы участвуете ✓':'Участие отменено');re()}
function promo(){const v=$('#pc').value.trim().toUpperCase();if(v=='MACRO'&&!st.promo){st.promo=1;st.days+=3;save();bal();boom();hp('heavy');toast('Промокод принят: +3 дня')}else toast(v=='MACRO'?'Код уже использован':'Неверный промокод')}
function trial(){hp('heavy');st.trial={k:'vless://'+Math.random().toString(16).slice(2,10)+'@trial.macro.example:443?security=reality#Macro-Test',exp:Date.now()+864e5};save();boom();toast('Тест-ключ выдан на 24 часа');re()}
function reset(){try{localStorage.removeItem('m_st')}catch(e){}st=mk();rot=0;save();re();toast('Тест-данные сброшены')}
function tick(){const n=Date.now();document.querySelectorAll('[data-cd]').forEach(e=>{const ms=e.dataset.cd-n;e.textContent=ms>0?fm(ms):e.dataset.done;const b=e.closest('.btn');if(b&&b.getAttribute('onclick')=='spin()')b.classList.toggle('ghost',ms>0)})}
function after(){document.querySelectorAll('[data-n]').forEach(el=>{const to=+el.dataset.n,s=performance.now();(function f(t){const p=Math.min(1,(t-s)/900);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(s)});const a=$('#arc');if(a)requestAnimationFrame(()=>requestAnimationFrame(()=>a.style.strokeDashoffset=276.5*(1-.968)));tick()}
function re(){const el=$('#app');el.innerHTML=P[TABS[cur][0]]();el.firstChild.classList.add('q');after()}
function go(k,first){const i=TABS.findIndex(t=>t[0]==k);if(i==cur||busy)return;const el=$('#app');el.style.setProperty('--dx',(i>cur?26:-26)+'px');const swap=()=>{el.innerHTML=P[k]();[...el.firstChild.children].forEach((c,j)=>c.style.setProperty('--i',j));cur=i;busy=false;scrollTo(0,0);after()};$('#ind').style.transform=`translateX(${i*100}%)`;document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('on',j==i));if(first)return swap();hp('light');busy=true;el.firstChild.classList.add('out');setTimeout(swap,200)}
if(G){
  $('#tabs').remove();
  const ok=/^(happ|incy|v2raytun|streisand|hiddify):\/\//i.test(G);
  $('#app').innerHTML=ok?'<div class="page" style="text-align:center;padding-top:28vh"><h2>Открываем приложение…</h2><div class="sub">Если ничего не произошло, нажмите кнопку</div><a class="btn" style="display:block;text-decoration:none" id="op">Открыть</a></div>':'<div class="page" style="padding-top:28vh;text-align:center"><h2>Ссылка не поддерживается</h2></div>';
  if(ok){$('#op').href=G;setTimeout(()=>location.href=G,300)}
}else{
  try{tg.ready();tg.expand();tg.setHeaderColor('#080b18');tg.setBackgroundColor('#080b18')}catch(e){}
  TABS.forEach(t=>{const b=document.createElement('div');b.className='tab';b.innerHTML=svg(t[2])+t[1];b.onclick=()=>go(t[0]);$('#tabs').appendChild(b)});
  document.addEventListener('pointerdown',e=>{const r=e.target.closest('.rip');if(!r)return;const b=r.getBoundingClientRect(),d=Math.max(b.width,b.height)*2.2,s=document.createElement('span');s.className='rp';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-b.left-d/2}px;top:${e.clientY-b.top-d/2}px`;r.appendChild(s);setTimeout(()=>s.remove(),650)});
  setInterval(tick,1000);go('home',true);
}
</script>
</body>
</html>
