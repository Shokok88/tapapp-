function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1900)}
function copy(k,msg){(navigator.clipboard?navigator.clipboard.writeText(k):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=k;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()}).finally(()=>{hp('medium');toast(msg)})}
function openApp(i){hp('medium');const u=location.origin+location.pathname+'?go='+encodeURIComponent(APPS[i][3]);try{tg.openLink(u)}catch(e){location.href=u}}
function shareRef(){const L=`https://t.me/${BOT}?start=ref_${user?user.id:0}`;hp('medium');try{tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(L)+'&text='+encodeURIComponent('Macro VPN: быстрый и стабильный VPN'))}catch(e){copy(L,'Ссылка скопирована ✓')}}
function boom(){const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const ps=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,r:Math.random()*5+3,c:['#8b5cf6','#34d399','#ffb454','#fff'][Math.random()*4|0],a:1}));(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a-=.012;x.globalAlpha=Math.max(p.a,0);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.6)});if(ps[0].a>0)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
function ovl(h,cls,lbl){const m=document.createElement('div');m.className=cls;m.innerHTML=`<div class="md glass">${h}<button class="btn ghost rip" style="margin-top:6px" onclick="closeSheet()">${lbl}</button></div>`;m.onclick=e=>{if(e.target==m)closeSheet()};document.body.appendChild(m);requestAnimationFrame(()=>m.classList.add('in'))}

function pay(a){st.bal+=a;hst('Пополнение через СБП',a);save();closeSheet();hp('heavy');toast('Баланс пополнен: +'+a+' ₽');re()}

function spin(){if(spinning)return;if(Date.now()<st.spin+864e5)return toast('Кейс откроется через '+fm(st.spin+864e5-Date.now()));spinning=true;hp('medium');const pool=[0,0,0,1,1,2,2,2,3,4,4,4,5,6,7,7],i=pool[Math.random()*pool.length|0],base=(360-i*45+(Math.random()*24-12)+720)%360,c=rot%360;rot+=360*6+((base-c+360)%360);$('#wh').style.transform=`rotate(${rot}deg)`;setTimeout(()=>{spinning=false;const z=PZ[i];if(z[1]=='r'){st.bal+=z[2];hst('Приз: '+z[0],z[2])}else if(z[1]=='d')addDays(z[2]);else st.gb+=z[2];st.inv.unshift({t:z[0],d:Date.now()});st.inv=st.inv.slice(0,20);st.spin=Date.now();save();if($('#cb'))$('#cb').textContent=rub(st.bal);boom();hp('heavy');modal('🎉 '+z[0],'Приз добавлен в ваш аккаунт');tick()},5300)}

function tick(){const n=Date.now();document.querySelectorAll('[data-cd]').forEach(e=>{const ms=e.dataset.cd-n;e.textContent=ms>0?fm(ms):e.dataset.done;const b=e.closest('.btn');if(b&&b.getAttribute('onclick')=='spin()')b.classList.toggle('ghost',ms>0)});const d=$('#dot');if(d)d.style.display=n>=st.spin+864e5?'block':'none'}
function after(){document.querySelectorAll('[data-n]').forEach(el=>{const to=+el.dataset.n,s=performance.now();(function f(t){const p=Math.min(1,(t-s)/900);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(s)});tick()}
function re(){const el=$('#app');el.innerHTML=P[page]();el.firstChild.classList.add('q');after()}
function go(k,first){if(!first&&(k==page||busy))return;const i=TI[k],el=$('#app');el.style.setProperty('--dx',((i==cur?k=='plans':i>cur)?26:-26)+'px');const swap=()=>{page=k;el.innerHTML=P[k]();[...el.firstChild.children].forEach((c,j)=>c.style.setProperty('--i',j));cur=i;busy=false;scrollTo(0,0);after()};$('#ind').style.transform=`translateX(${i*100}%)`;document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('on',j==i));try{k=='plans'?tg.BackButton.show():tg.BackButton.hide()}catch(e){}if(first)return swap();hp('light');busy=true;el.firstChild.classList.add('out');setTimeout(swap,200)}
theme(st.th,true);save();

  $('#tabs').remove();
  const ok=/^(happ|incy|v2raytun|streisand|hiddify):\/\//i.test(G);

  if(ok){$('#op').href=G;setTimeout(()=>location.href=G,300)}
}else{
  try{tg.ready();tg.expand();tg.BackButton.onClick(()=>go('sub'))}catch(e){}

  document.addEventListener('pointerdown',e=>{const r=e.target.closest('.rip');if(!r)return;const b=r.getBoundingClientRect(),d=Math.max(b.width,b.height)*2.2,s=document.createElement('span');s.className='rp';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-b.left-d/2}px;top:${e.clientY-b.top-d/2}px`;r.appendChild(s);setTimeout(()=>s.remove(),650)});
  setInterval(tick,1000);go('home',true);
}
